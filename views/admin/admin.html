<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="Quản trị trang web Diagram.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <script id="boot-data" type="application/json">{{boot}}</script>

  <header class="site-header">
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="hamburger" id="menuBtn" aria-label="Mo menu"></button>
      <a class="brand" href="/">
        <svg width="26" height="26" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <rect x="4" y="4" width="56" height="56" rx="14" fill="#4f46e5"/>
          <rect x="14" y="18" width="16" height="12" rx="3" fill="#fff" fill-opacity="0.95"/>
          <rect x="36" y="36" width="16" height="12" rx="3" fill="#fff" fill-opacity="0.7"/>
          <path d="M30 24 C34 24, 32 38, 36 40" stroke="#c7d2fe" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        </svg>
        <span>Diagram</span>
      </a>
    </div>
    <div class="header-actions">
      <span class="badge badge-accent" id="storageBadge">memory</span>
      <button class="hamburger" id="themeBtn" aria-label="Doi chu de"></button>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <h1>Quản lý trang web</h1>
    </div>

    <div class="stats-grid" id="statsGrid">
      <div class="skeleton" style="height:100px"></div>
      <div class="skeleton" style="height:100px"></div>
      <div class="skeleton" style="height:100px"></div>
      <div class="skeleton" style="height:100px"></div>
    </div>

    <section class="mt-2" id="userSection">
      <h2 style="margin:0 0 12px;font-size:18px;">Người dùng</h2>
      <div class="table-wrap">
        <table class="admin-table" aria-label="Danh sach nguoi dung">
          <thead>
            <tr>
              <th>Người dùng</th>
              <th>Email</th>
              <th>Vai trò</th>
              <th>Trạng thái</th>
              <th>Ngày tạo</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="usersBody">
            <tr><td colspan="6"><div class="skeleton" style="height:40px"></div></td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <div class="mt-3 mb-3 card" id="sysCard" hidden>
      <h2 style="margin:0 0 12px;font-size:16px;">Hệ thống</h2>
      <div id="sysInfo" class="mono text-soft" style="font-size:13px;line-height:2"></div>
    </div>
  </main>

  <script src="/js/core.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
