<!doctype html>
<html lang="vi" data-auth="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="Tạo tài khoản Diagram — tài khoản đầu tiên trở thành quản trị viên.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <script id="boot-data" type="application/json">{{boot}}</script>

  <div class="auth-wrap">
    <div class="auth-card">
      <a class="brand" href="/">
        <svg width="30" height="30" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <rect x="4" y="4" width="56" height="56" rx="14" fill="#4f46e5"/>
          <rect x="14" y="18" width="16" height="12" rx="3" fill="#fff" fill-opacity="0.95"/>
          <rect x="36" y="36" width="16" height="12" rx="3" fill="#fff" fill-opacity="0.7"/>
          <path d="M30 24 C34 24, 32 38, 36 40" stroke="#c7d2fe" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        </svg>
        <span>Diagram</span>
      </a>
      <h1>Đăng ký</h1>
      <p class="sub">Miễn phí. Tài khoản đầu tiên tự động trở thành quản trị viên.</p>

      <div class="form-alert" id="formAlert" role="alert"></div>

      <form id="registerForm" method="post" action="/register" novalidate>
        <div class="field">
          <label for="username">Tên đăng nhập</label>
          <input class="input" type="text" id="username" name="username" autocomplete="username" required minlength="3" maxlength="32" placeholder="ví dụ: hoaithanh">
          <div class="field-error" id="err-username"></div>
          <div class="field-hint">3–32 ký tự: chữ, số, . _ -</div>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" type="email" id="email" name="email" autocomplete="email" required placeholder="ban@vidu.com">
          <div class="field-error" id="err-email"></div>
        </div>
        <div class="field">
          <label for="password">Mật khẩu</label>
          <input class="input" type="password" id="password" name="password" autocomplete="new-password" required minlength="8" placeholder="••••••••">
          <div class="field-error" id="err-password"></div>
          <div class="field-hint">Tối thiểu 8 ký tự</div>
        </div>
        <div class="field">
          <label for="confirmPassword">Xác nhận mật khẩu</label>
          <input class="input" type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required placeholder="••••••••">
          <div class="field-error" id="err-confirmPassword"></div>
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit" id="submitBtn">Tạo tài khoản</button>
      </form>

      <p class="switch-link">Đã có tài khoản? <a href="/login">Đăng nhập</a></p>
    </div>
  </div>

  <script src="/js/core.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
