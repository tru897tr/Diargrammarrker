<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="Danh sách sơ đồ của bạn trên Diagram.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <script id="boot-data" type="application/json">{{boot}}</script>

  <header class="site-header">
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="hamburger" id="menuBtn" aria-label="Mở menu"></button>
      <a class="brand" href="/">
        <svg width="26" height="26" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <rect x="4" y="4" width="56" height="56" rx="14" fill="#4f46e5"/>
          <rect x="14" y="18" width="16" height="12" rx="3" fill="#fff" fill-opacity="0.95"/>
          <rect x="36" y="36" width="16" height="12" rx="3" fill="#fff" fill-opacity="0.7"/>
          <path d="M30 24 C34 24, 32 38, 36 40" stroke="#c7d2fe" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        </svg>
        <span>Diagram</span>
      </a>
    </div>
    <div class="header-actions">
      <button class="hamburger" id="themeBtn" aria-label="Đổi chủ đề"></button>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <h1>Sơ đồ của bạn</h1>
      <a class="btn btn-primary" href="/create" id="newBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Tạo sơ đồ mới
      </a>
    </div>

    <div class="diagram-list" id="list" aria-live="polite">
      <div class="skeleton" style="height:72px"></div>
      <div class="skeleton" style="height:72px"></div>
      <div class="skeleton" style="height:72px"></div>
    </div>

    <div class="empty-state hidden" id="empty">
      <svg width="56" height="56" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <rect x="6" y="10" width="52" height="44" rx="8" stroke="currentColor" stroke-width="2.5"/>
        <rect x="16" y="22" width="14" height="10" rx="2" stroke="currentColor" stroke-width="2.5"/>
        <rect x="36" y="34" width="14" height="10" rx="2" stroke="currentColor" stroke-width="2.5"/>
        <path d="M30 27c4 0 2 12 6 14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <h3>Bạn chưa có sơ đồ nào.</h3>
      <p>Hãy bắt đầu tạo sơ đồ đầu tiên của bạn.</p>
      <a class="btn btn-primary btn-lg" href="/create">Tạo sơ đồ</a>
    </div>
  </main>

  <script src="/js/core.js"></script>
  <script src="/js/list.js"></script>
</body>
</html>
