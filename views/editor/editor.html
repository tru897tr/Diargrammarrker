<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="Trình soạn thảo sơ đồ Diagram — canvas vô hạn.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="stylesheet" href="/css/editor.css">
</head>
<body class="editor-page">
  <script id="boot-data" type="application/json">{{boot}}</script>

  <div class="editor-root" id="editorRoot">
    <header class="editor-topbar">
      <button class="tb-btn" id="menuBtn" aria-label="Mở menu" data-tip="Menu"></button>
      <input class="diagram-name-input" id="diagramName" placeholder="Sơ đồ chưa đặt tên" maxlength="120" aria-label="Tên sơ đồ">
      <span class="save-state" id="saveState" role="status" aria-live="polite"></span>

      <div class="tb-group" role="group" aria-label="Hoàn tác và làm lại">
        <button class="tb-btn" id="undoBtn" aria-label="Hoàn tác (Ctrl+Z)" data-tip="Hoàn tác (Ctrl+Z)" disabled></button>
        <button class="tb-btn" id="redoBtn" aria-label="Làm lại (Ctrl+Shift+Z)" data-tip="Làm lại (Ctrl+Shift+Z)" disabled></button>
      </div>

      <div class="topbar-right">
        <button class="btn btn-secondary btn-sm" id="presentBtn" type="button"></button>
        <button class="tb-btn panel-toggle" id="panelToggle" aria-label="Bảng thuộc tính" data-tip="Bảng thuộc tính"></button>
        <button class="btn btn-primary btn-sm" id="saveBtn" type="button"></button>
      </div>
    </header>

    <nav class="ribbon" id="ribbon" aria-label="Thanh công cụ">
      <div class="ribbon-tabs" id="ribbonTabs" role="tablist"></div>
      <div class="ribbon-body" id="ribbonBody"></div>
    </nav>

    <div class="editor-body">
      <div class="canvas-host" id="canvasHost">
        <svg class="diagram-svg" id="svgRoot" xmlns="http://www.w3.org/2000/svg" role="application" aria-label="Khung vẽ sơ đồ"></svg>
        <div class="ctx-bar hidden" id="ctxBar" role="toolbar" aria-label="Thao tác nhanh"></div>
        <div class="canvas-hud" id="hud">
          <button class="hud-btn" id="zoomOut" aria-label="Thu nhỏ" data-tip="Thu nhỏ (−)"></button>
          <span class="hud-zoom" id="zoomLabel">100%</span>
          <button class="hud-btn" id="zoomIn" aria-label="Phóng to" data-tip="Phóng to (+)"></button>
          <button class="hud-btn" id="fitBtn" aria-label="Xem toàn bộ" data-tip="Vừa khung hình (Shift+1)"></button>
          <button class="hud-btn" id="resetZoom" aria-label="Đặt lại 100%" data-tip="100% (Ctrl+0)"></button>
        </div>
        <div class="empty-hint hidden" id="emptyHint">
          <strong>Khung vẽ đang trống</strong>
          <span>Mở tab <b>Chèn</b> để thêm hình, ảnh, video hoặc nhúng YouTube/Canva. Kéo thả ảnh vào đây cũng được.</span>
        </div>
      </div>

      <aside class="style-panel" id="stylePanel" aria-label="Bảng thuộc tính"></aside>
    </div>
  </div>

  <script src="/js/core.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/media.js"></script>
  <script src="/js/editor-canvas.js"></script>
  <script src="/js/colorpicker.js"></script>
  <script src="/js/present.js"></script>
  <script src="/js/editor.js"></script>
</body>
</html>
